<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <h1>Chatbot</h1>
    <button id="newChat" type="button">New chat</button>
    <nav id="chatList" class="chat-list" aria-label="Chat history"></nav>
    <p class="hint">Powered by the Claude API</p>
  </aside>

  <main>
    <div id="messages" class="messages" aria-live="polite">
      <div class="empty" id="empty">
        <h2>What can I help with?</h2>
        <p>Ask a question, paste some code, or draft an email.</p>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the assistant" autofocus></textarea>
      <button id="send" type="button">Send</button>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
